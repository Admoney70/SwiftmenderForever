# Packages the addon and uploads it to CurseForge (and a GitHub release)
# whenever a version tag like v1.0.0 is pushed.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret   CF_API_KEY        CurseForge API token (curseforge.com > account > API tokens)
#   variable CF_PROJECT_ID     optional; the project id is also in the TOC
#                              (## X-Curse-Project-ID), which the packager reads
#   variable CF_GAME_VERSIONS  optional, e.g. "12.1.5" -- overrides the game
#                              version the packager derives from the TOC
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release, e.g. v1.0.1 (leave empty for a test build)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Manual runs can create the release tag themselves (the packager
      # names and classifies the build from the tag on HEAD).
      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Swiftmender Forever $VERSION"
          git push origin "$VERSION"

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: >-
            ${{ vars.CF_PROJECT_ID && format('-p {0}', vars.CF_PROJECT_ID) || '' }}
            ${{ vars.CF_GAME_VERSIONS && format('-g {0}', vars.CF_GAME_VERSIONS) || '' }}
